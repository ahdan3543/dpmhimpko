
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPM HIMA PKO - Suara Mahasiswa PKO</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Babel untuk menjalankan TSX langsung di browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        #error-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            color: #ef4444;
            padding: 2rem;
            z-index: 9999;
            font-family: monospace;
            overflow: auto;
        }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "react-router-dom": "https://esm.sh/react-router-dom@6.22.3",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0"
      }
    }
    </script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="error-overlay">
        <h1 style="font-size: 1.5rem; margin-bottom: 1rem;">Terjadi Kesalahan Loading:</h1>
        <div id="error-message"></div>
        <p style="margin-top: 2rem; color: #94a3b8;">Tips: Pastikan Anda menggunakan 'Live Server' (VS Code) atau akses via GitHub Pages (HTTPS). Jangan klik dua kali file HTML langsung.</p>
    </div>

    <div id="root">
        <div class="min-h-screen flex items-center justify-center bg-slate-50">
            <div class="flex flex-col items-center gap-4">
                <div class="w-12 h-12 border-4 border-red-800 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-slate-500 font-medium animate-pulse">Menghubungkan ke Server DPM PKO...</p>
            </div>
        </div>
    </div>
    
    <script>
        // Penanganan Error Global
        window.onerror = function(msg, url, line, col, error) {
            const overlay = document.getElementById('error-overlay');
            const msgBox = document.getElementById('error-message');
            overlay.style.display = 'block';
            msgBox.innerText = `${msg}\n\nLokasi: ${url}\nBaris: ${line}`;
            return false;
        };
    </script>

    <!-- Memuat Aplikasi -->
    <script type="text/babel" data-presets="react,typescript" data-type="module">
        import React from 'react';
        import ReactDOM from 'react-dom/client';
        import App from './App.tsx';

        try {
            const rootElement = document.getElementById('root');
            const root = ReactDOM.createRoot(rootElement);
            root.render(
                <React.StrictMode>
                    <App />
                </React.StrictMode>
            );
        } catch (err) {
            console.error("Render Error:", err);
            document.getElementById('error-overlay').style.display = 'block';
            document.getElementById('error-message').innerText = err.message;
        }
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
